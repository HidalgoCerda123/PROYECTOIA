<text x="10" y="381" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">(ValueError)</text>
<text x="10" y="475" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">503/429/timeout:</text>
<text x="10" y="491" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">ErrorTransitorio -> reintento</text>
<text x="10" y="507" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">otros: RuntimeError</text>
<text x="10" y="585" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">try/except KeyError e</text>
<text x="10" y="601" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">IndexError</text>
<text x="10" y="695" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">try/except JSONDecodeError;</text>
<text x="10" y="711" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">valida tipo y fecha</text>
<text x="10" y="727" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">(RuntimeError)</text>
<text x="10" y="805" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">reemplaza el documento</text>
<text x="10" y="821" text-anchor="start" font-family="Segoe Print, Comic Sans MS, sans-serif" font-size="12" fill="#f08c00">del mismo tipo y patente</text>
